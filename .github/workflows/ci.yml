name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The generated database is committed, so a rebuild must be a no-op.
      # If this fails, someone edited src/data by hand instead of data/raw.
      - name: Data is in sync with its source
        run: |
          npm run build:data
          git diff --exit-code -- src/data

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

      - name: End-to-end smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artifacts/
          if-no-files-found: warn

  deploy:
    # Only the default branch publishes. Resolved dynamically because this
    # repository's default branch is not named main.
    #
    # Publishing works by pushing the build to a gh-pages branch: creating
    # that branch auto-enables Pages, whereas the workflow-based deploy needs
    # a site-creation API call GITHUB_TOKEN is not allowed to make.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for Pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npx vite build
      - name: Publish dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
      - run: echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
