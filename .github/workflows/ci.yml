name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The generated database is committed, so a rebuild must be a no-op.
      # If this fails, someone edited src/data by hand instead of data/raw.
      - name: Data is in sync with its source
        run: |
          npm run build:data
          git diff --exit-code -- src/data

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

      - name: End-to-end smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artifacts/
          if-no-files-found: warn

  deploy:
    # Only the default branch publishes. Resolved dynamically because this
    # repository's default branch is not named main.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for Pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npx vite build
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first deploy; nobody has to touch settings.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
